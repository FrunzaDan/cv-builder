<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- ════════ FORM PANEL ════════ -->
      <div class="form-panel">
        <div class="form-header">
          <div class="form-header-left">
            <h1>CV Builder</h1>
            <p>Live preview updates as you type</p>
          </div>
          <div class="form-header-actions">
            <button id="btn-import" class="btn-import" type="button">
              📂 Import
            </button>
            <button id="btn-export-json" class="btn-import" type="button">
              💾 Save JSON
            </button>
            <button id="btn-export" class="btn-export" type="button">
              ⬇ Export as PDF
            </button>
            <button id="btn-clear" class="btn-clear" type="button">
              🗑 Clear Saved Data
            </button>
          </div>
          <input type="file" id="json-input" accept=".json" hidden />
        </div>

        <div class="form-body">
          <!-- Personal Info -->
          <div class="section-title">Personal Information</div>

          <div class="photo-upload" id="photo-upload">
            <div class="photo-thumb" id="photo-thumb">
              <span class="photo-thumb-plus">+</span>
            </div>
            <div class="photo-upload-info">
              <strong>Profile Photo</strong>
              <span>Click to upload (JPG / PNG)</span>
              <button class="photo-remove" id="photo-remove" type="button">
                Remove photo
              </button>
            </div>
            <input type="file" id="photo-input" accept="image/*" hidden />
          </div>

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="f-name" placeholder="Name" />
          </div>
          <div class="form-group">
            <label>Job Title / Position</label>
            <input
              type="text"
              id="f-role"
              placeholder="Senior Software Engineer"
            />
          </div>
          <div class="row-2">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="f-email" placeholder="name@example.com" />
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="text" id="f-phone" placeholder="+1 234 567 890" />
            </div>
          </div>
          <div class="form-group">
            <label>Address / Location</label>
            <input
              type="text"
              id="f-address"
              placeholder="Bucharest, Romania"
            />
          </div>
          <div class="row-2">
            <div class="form-group">
              <label>LinkedIn</label>
              <input
                type="text"
                id="f-linkedin"
                placeholder="linkedin.com/in/name"
              />
            </div>
            <div class="form-group">
              <label>Website / GitHub</label>
              <input type="text" id="f-website" placeholder="github.com/name" />
            </div>
          </div>
          <div class="row-2">
            <div class="form-group">
              <label>Date of Birth</label>
              <input type="text" id="f-dob" placeholder="Jan 01, 1990" />
            </div>
            <div class="form-group">
              <label>Driver's License</label>
              <input type="text" id="f-license" placeholder="Class B" />
            </div>
          </div>

          <!-- Summary -->
          <div class="section-title">Professional Summary</div>
          <div class="form-group">
            <textarea
              id="f-summary"
              placeholder="A concise overview of your background and core strengths…"
            ></textarea>
          </div>

          <!-- Experience -->
          <div class="section-title">Work Experience</div>
          <div id="exp-list"></div>
          <button id="btn-add-exp" class="btn-add" type="button">
            + Add Work Experience
          </button>

          <!-- Education -->
          <div class="section-title">Education</div>
          <div id="edu-list"></div>
          <button id="btn-add-edu" class="btn-add" type="button">
            + Add Education
          </button>

          <!-- Skills -->
          <div class="section-title">Skills</div>
          <div class="tag-row">
            <input
              type="text"
              id="skill-input"
              placeholder="e.g. JavaScript, Figma, Agile…"
            />
            <button id="btn-add-skill" class="btn-tag-add" type="button">
              +
            </button>
          </div>
          <div id="skills-list" class="tags-list"></div>

          <!-- Languages -->
          <div class="section-title">Languages</div>
          <div id="lang-list"></div>
          <button id="btn-add-lang" class="btn-add" type="button">
            + Add Language
          </button>

          <!-- Miscellaneous -->
          <div class="section-title">Additional Information</div>
          <div class="form-group">
            <textarea
              id="f-misc"
              placeholder="Certifications, awards, hobbies, volunteer work…"
            ></textarea>
          </div>
        </div>
        <!-- /form-body -->
      </div>
      <!-- /form-panel -->

      <!-- ════════ PREVIEW PANEL ════════ -->
      <div class="preview-panel">
        <div class="preview-label">Live Preview</div>
        <div id="cv-pages"></div>
        <!-- Hidden: one continuous, unpaginated render used only for
             measuring safe page-break points and for the PDF export. -->
        <div id="cv-source-wrap" aria-hidden="true">
          <div id="cv-source" class="cv-sheet"></div>
        </div>
      </div>
    </div>

    <!-- ════════ CONFIRM MODAL ════════ -->
    <div id="modal-overlay" class="modal-overlay">
      <div
        id="modal-box"
        class="modal-box"
        role="alertdialog"
        aria-modal="true"
        aria-describedby="modal-message"
      >
        <p id="modal-message" class="modal-message"></p>
        <div class="modal-actions">
          <button
            id="modal-cancel"
            class="modal-btn modal-btn-cancel"
            type="button"
          >
            Cancel
          </button>
          <button id="modal-ok" class="modal-btn modal-btn-ok" type="button">
            OK
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
